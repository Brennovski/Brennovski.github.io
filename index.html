<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reliable Cars</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; }header {
  display: flex;
  justify-content: space-between;
  padding: 20px 40px;
  background: rgba(0,0,0,0.3);
  position: fixed;
  width: 100%;
}

header h1 { color: #38bdf8; }

nav a {
  margin-left: 20px;
  text-decoration: none;
  color: #fff;
}

.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: linear-gradient(135deg, #0f172a, #1e293b);
}

.hero h2 {
  font-size: 3rem;
  margin-bottom: 20px;
}

.hero button {
  padding: 15px 30px;
  background: #38bdf8;
  border: none;
  color: #000;
  font-weight: bold;
  cursor: pointer;
  border-radius: 10px;
}

.cars {
  padding: 60px 40px;
}

.cars h3 {
  margin-bottom: 20px;
  font-size: 2rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  transition: 0.3s;
}

.card:hover { transform: translateY(-5px); }

footer {
  text-align: center;
  padding: 20px;
  background: #020617;
}

  </style>
</head>
<body><header>
  <h1>Reliable</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Carros</a>
    <a href="#">Contato</a>
  </nav>
</header><section class="hero">
  <h2>Encontre seu carro ideal</h2>
  <p>Qualidade, confiança e os melhores preços</p>
  <br>
  <button>Ver veículos</button>
</section><section class="cars">
  <h3>Carros em destaque</h3>
  <div class="grid"><div class="card">
  <h4>BMW X5</h4>
  <p>R$ 350.000</p>
</div>

<div class="card">
  <h4>Audi A4</h4>
  <p>R$ 220.000</p>
</div>

<div class="card">
  <h4>Mercedes C300</h4>
  <p>R$ 280.000</p>
</div>

  </div>
</section><footer>
  <p>© 2026 Reliable Cars - Todos os direitos reservados</p>
</footer></body>
</html>
