<!DOCTYPE html><!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ark. — Criamos produtos digitais que importam</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #070707;
    --off-black: #0d0d0d;
    --surface: #111111;
    --border: #1e1e1e;
    --muted: #3a3a3a;
    --text-dim: #6b6b6b;
    --text-mid: #a0a0a0;
    --text: #e8e8e8;
    --white: #f5f5f0;
    --accent: #c8fa5f;
    --accent-dim: rgba(200,250,95,0.12);
    --accent-glow: rgba(200,250,95,0.06);
    --red: #ff4433;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out: cubic-bezier(0.45, 0, 0.55, 1);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
    cursor: none;
  }

  /* ─── CURSOR ─── */
  #cursor-dot {
    position: fixed; top: 0; left: 0; z-index: 9999; pointer-events: none;
    width: 6px; height: 6px; background: var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.08s var(--ease-out), width 0.25s var(--ease-out), height 0.25s var(--ease-out), background 0.25s;
    mix-blend-mode: normal;
  }
  #cursor-ring {
    position: fixed; top: 0; left: 0; z-index: 9998; pointer-events: none;
    width: 32px; height: 32px;
    border: 1px solid rgba(200,250,95,0.4);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.18s var(--ease-out), width 0.3s var(--ease-out), height 0.3s var(--ease-out), border-color 0.3s, opacity 0.3s;
  }
  body.link-hover #cursor-dot { width: 10px; height: 10px; }
  body.link-hover #cursor-ring { width: 48px; height: 48px; border-color: rgba(200,250,95,0.7); }

  /* ─── NOISE OVERLAY ─── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 9990; pointer-events: none;
    opacity: 0.028;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    mix-blend-mode: overlay;
  }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: var(--black); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

  /* ─── NAV ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 3rem;
    border-bottom: 1px solid transparent;
    transition: border-color 0.4s, background 0.4s, padding 0.3s;
  }
  nav.scrolled {
    background: rgba(7,7,7,0.88);
    backdrop-filter: blur(18px);
    border-color: var(--border);
    padding: 0.9rem 3rem;
  }
  .nav-logo {
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--white);
    text-decoration: none;
  }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; align-items: center; gap: 2.5rem; }
  .nav-links a {
    font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-mid); text-decoration: none;
    transition: color 0.2s; position: relative;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -3px; left: 0;
    width: 0; height: 1px; background: var(--accent);
    transition: width 0.3s var(--ease-out);
  }
  .nav-links a:hover { color: var(--white); }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta {
    font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--black) !important;
    background: var(--accent); padding: 0.55rem 1.2rem; border-radius: 2px;
    text-decoration: none; transition: background 0.2s, transform 0.2s;
  }
  .nav-cta:hover { background: var(--white); transform: translateY(-1px); }
  .nav-cta::after { display: none !important; }

  /* ─── HERO ─── */
  #hero {
    min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 3rem 4rem;
    position: relative; overflow: hidden;
  }
  .hero-canvas {
    position: absolute; inset: 0; z-index: 0;
  }
  .hero-gradient {
    position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(ellipse 70% 55% at 60% 40%, rgba(200,250,95,0.05) 0%, transparent 70%),
                linear-gradient(180deg, rgba(7,7,7,0) 40%, rgba(7,7,7,0.9) 80%, var(--black) 100%);
  }
  .hero-content { position: relative; z-index: 2; max-width: 1100px; padding-top: 3rem; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent);
    border: 1px solid rgba(200,250,95,0.25); padding: 0.4rem 0.8rem;
    border-radius: 2px; margin-bottom: 2rem;
    opacity: 0; animation: fadeUp 0.8s var(--ease-out) 0.3s forwards;
  }
  .hero-badge-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

  .hero-title {
    font-family: var(--font-display); font-size: clamp(3.5rem, 8vw, 8rem);
    font-weight: 800; line-height: 0.95; letter-spacing: -0.03em;
    color: var(--white); margin-bottom: 1.5rem;
    opacity: 0; animation: fadeUp 0.9s var(--ease-out) 0.5s forwards;
  }
  .hero-title em { font-style: normal; color: var(--accent); }
  .hero-title .line2 { display: block; color: var(--text-dim); }

  .hero-sub {
    max-width: 480px; font-size: 1rem; color: var(--text-mid); line-height: 1.7;
    margin-bottom: 2.5rem;
    opacity: 0; animation: fadeUp 0.9s var(--ease-out) 0.7s forwards;
  }
  .hero-actions {
    display: flex; align-items: center; gap: 1.5rem;
    opacity: 0; animation: fadeUp 0.9s var(--ease-out) 0.9s forwards;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--black); background: var(--accent);
    padding: 0.9rem 1.8rem; border-radius: 2px; text-decoration: none;
    transition: background 0.2s, transform 0.2s; font-weight: 500;
  }
  .btn-primary:hover { background: var(--white); transform: translateY(-2px); }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-mid);
    padding: 0.9rem 0; text-decoration: none;
    border-bottom: 1px solid var(--muted);
    transition: color 0.2s, border-color 0.2s;
  }
  .btn-ghost:hover { color: var(--white); border-color: var(--white); }

  .hero-scroll {
    position: absolute; right: 3rem; bottom: 4rem; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
    opacity: 0; animation: fadeIn 1s var(--ease-out) 1.4s forwards;
  }
  .hero-scroll span {
    font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim);
    writing-mode: vertical-rl;
  }
  .scroll-line {
    width: 1px; height: 60px; background: linear-gradient(to bottom, var(--accent), transparent);
    animation: scrollDown 1.8s var(--ease-in-out) infinite;
  }
  @keyframes scrollDown {
    0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}50.01%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}
  }

  @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* ─── MARQUEE ─── */
  .marquee-strip {
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 1rem 0; overflow: hidden; background: var(--off-black);
  }
  .marquee-track {
    display: flex; gap: 3rem; width: max-content;
    animation: marquee 22s linear infinite;
  }
  .marquee-item {
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim); white-space: nowrap;
    display: flex; align-items: center; gap: 1rem;
  }
  .marquee-item .sep { color: var(--accent); }
  @keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }

  /* ─── SECTION COMMON ─── */
  section { padding: 7rem 3rem; }
  .section-label {
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 1rem;
  }
  .section-title {
    font-family: var(--font-display); font-size: clamp(2.2rem, 4.5vw, 4rem);
    font-weight: 800; line-height: 1.05; letter-spacing: -0.025em; color: var(--white);
  }
  .section-desc {
    font-size: 0.95rem; color: var(--text-mid); line-height: 1.75; max-width: 420px;
    margin-top: 1rem;
  }

  /* ─── SOBRE ─── */
  #sobre { background: var(--off-black); border-top: 1px solid var(--border); }
  .sobre-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: center;
    max-width: 1200px; margin: 0 auto;
  }
  .sobre-visual {
    position: relative; aspect-ratio: 4/5; overflow: hidden; border-radius: 3px;
  }
  .sobre-visual-inner {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, var(--surface) 0%, var(--off-black) 100%);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }

<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ark. — Criamos produtos digitais que importam</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #070707;
    --off-black: #0d0d0d;
    --surface: #111111;
    --border: #1e1e1e;
    --muted: #3a3a3a;
    --text-dim: #6b6b6b;
    --text-mid: #a0a0a0;
    --text: #e8e8e8;
    --white: #f5f5f0;
    --accent: #c8fa5f;
    --accent-dim: rgba(200,250,95,0.12);
    --accent-glow: rgba(200,250,95,0.06);
    --red: #ff4433;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out: cubic-bezier(0.45, 0, 0.55, 1);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
    cursor: none;
  }

  /* ─── CURSOR ─── */
  #cursor-dot {
    position: fixed; top: 0; left: 0; z-index: 9999; pointer-events: none;
    width: 6px; height: 6px; background: var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.08s var(--ease-out), width 0.25s var(--ease-out), height 0.25s var(--ease-out), background 0.25s;
    mix-blend-mode: normal;
  }
  #cursor-ring {
    position: fixed; top: 0; left: 0; z-index: 9998; pointer-events: none;
    width: 32px; height: 32px;
    border: 1px solid rgba(200,250,95,0.4);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.18s var(--ease-out), width 0.3s var(--ease-out), height 0.3s var(--ease-out), border-color 0.3s, opacity 0.3s;
  }
  body.link-hover #cursor-dot { width: 10px; height: 10px; }
  body.link-hover #cursor-ring { width: 48px; height: 48px; border-color: rgba(200,250,95,0.7); }

  /* ─── NOISE OVERLAY ─── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 9990; pointer-events: none;
    opacity: 0.028;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    mix-blend-mode: overlay;
  }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: var(--black); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

  /* ─── NAV ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 3rem;
    border-bottom: 1px solid transparent;
    transition: border-color 0.4s, background 0.4s, padding 0.3s;
  }
  nav.scrolled {
    background: rgba(7,7,7,0.88);
    backdrop-filter: blur(18px);
    border-color: var(--border);
    padding: 0.9rem 3rem;
  }
  .nav-logo {
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--white);
    text-decoration: none;
  }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; align-items: center; gap: 2.5rem; }
  .nav-links a {
    font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-mid); text-decoration: none;
    transition: color 0.2s; position: relative;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -3px; left: 0;
    width: 0; height: 1px; background: var(--accent);
    transition: width 0.3s var(--ease-out);
  }
  .nav-links a:hover { color: var(--white); }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta {
    font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--black) !important;
    background: var(--accent); padding: 0.55rem 1.2rem; border-radius: 2px;
    text-decoration: none; transition: background 0.2s, transform 0.2s;
  }
  .nav-cta:hover { background: var(--white); transform: translateY(-1px); }
  .nav-cta::after { display: none !important; }

  /* ─── HERO ─── */
  #hero {
    min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 3rem 4rem;
    position: relative; overflow: hidden;
  }
  .hero-canvas {
    position: absolute; inset: 0; z-index: 0;
  }
  .hero-gradient {
    position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(ellipse 70% 55% at 60% 40%, rgba(200,250,95,0.05) 0%, transparent 70%),
                linear-gradient(180deg, rgba(7,7,7,0) 40%, rgba(7,7,7,0.9) 80%, var(--black) 100%);
  }
  .hero-content { position: relative; z-index: 2; max-width: 1100px; padding-top: 3rem; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent);
    border: 1px solid rgba(200,250,95,0.25); padding: 0.4rem 0.8rem;
    border-radius: 2px; margin-bottom: 2rem;
    opacity: 0; animation: fadeUp 0.8s var(--ease-out) 0.3s forwards;
  }
  .hero-badge-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

  .hero-title {
    font-family: var(--font-display); font-size: clamp(3.5rem, 8vw, 8rem);
    font-weight: 800; line-height: 0.95; letter-spacing: -0.03em;
    color: var(--white); margin-bottom: 1.5rem;
    opacity: 0; animation: fadeUp 0.9s var(--ease-out) 0.5s forwards;
  }
  .hero-title em { font-style: normal; color: var(--accent); }
  .hero-title .line2 { display: block; color: var(--text-dim); }

  .hero-sub {
    max-width: 480px; font-size: 1rem; color: var(--text-mid); line-height: 1.7;
    margin-bottom: 2.5rem;
    opacity: 0; animation: fadeUp 0.9s var(--ease-out) 0.7s forwards;
  }
  .hero-actions {
    display: flex; align-items: center; gap: 1.5rem;
    opacity: 0; animation: fadeUp 0.9s var(--ease-out) 0.9s forwards;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--black); background: var(--accent);
    padding: 0.9rem 1.8rem; border-radius: 2px; text-decoration: none;
    transition: background 0.2s, transform 0.2s; font-weight: 500;
  }
  .btn-primary:hover { background: var(--white); transform: translateY(-2px); }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-mid);
    padding: 0.9rem 0; text-decoration: none;
    border-bottom: 1px solid var(--muted);
    transition: color 0.2s, border-color 0.2s;
  }
  .btn-ghost:hover { color: var(--white); border-color: var(--white); }

  .hero-scroll {
    position: absolute; right: 3rem; bottom: 4rem; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
    opacity: 0; animation: fadeIn 1s var(--ease-out) 1.4s forwards;
  }
  .hero-scroll span {
    font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim);
    writing-mode: vertical-rl;
  }
  .scroll-line {
    width: 1px; height: 60px; background: linear-gradient(to bottom, var(--accent), transparent);
    animation: scrollDown 1.8s var(--ease-in-out) infinite;
  }
  @keyframes scrollDown {
    0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}50.01%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}
  }

  @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* ─── MARQUEE ─── */
  .marquee-strip {
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 1rem 0; overflow: hidden; background: var(--off-black);
  }
  .marquee-track {
    display: flex; gap: 3rem; width: max-content;
    animation: marquee 22s linear infinite;
  }
  .marquee-item {
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim); white-space: nowrap;
    display: flex; align-items: center; gap: 1rem;
  }
  .marquee-item .sep { color: var(--accent); }
  @keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }

  /* ─── SECTION COMMON ─── */
  section { padding: 7rem 3rem; }
  .section-label {
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 1rem;
  }
  .section-title {
    font-family: var(--font-display); font-size: clamp(2.2rem, 4.5vw, 4rem);
    font-weight: 800; line-height: 1.05; letter-spacing: -0.025em; color: var(--white);
  }
  .section-desc {
    font-size: 0.95rem; color: var(--text-mid); line-height: 1.75; max-width: 420px;
    margin-top: 1rem;
  }

  /* ─── SOBRE ─── */
  #sobre { background: var(--off-black); border-top: 1px solid var(--border); }
  .sobre-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: center;
    max-width: 1200px; margin: 0 auto;
  }
  .sobre-visual {
